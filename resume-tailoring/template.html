<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume draft</title>
<style>
  @page { size: letter; margin: 0.62in; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #171717; background: #fff; font: 10.5pt/1.15 Arial, sans-serif; }
  .page { max-width: 7.26in; margin: 0 auto; background: #fff; }
  header { margin-bottom: 8pt; }
  h1 { margin: 0 0 4pt; font-size: 17pt; line-height: 1.1; font-weight: 700; }
  .contact { font-size: 9pt; }
  h2 { font-size: 10.5pt; border-bottom: 0.5pt solid #999; padding-bottom: 2pt; margin: 9pt 0 4pt; }
  .entry { margin: 0 0 5pt; break-inside: avoid; }
  .entry-head { display: flex; justify-content: space-between; gap: 8pt; font-weight: 700; }
  .dates { white-space: nowrap; font-weight: 400; }
  ul { margin: 2pt 0 0; padding-left: 21.6pt; }
  li { margin: 0 0 3pt; break-inside: avoid; }
  p { margin: 0 0 4pt; }
  @media screen { body { padding: 24px; } .page { box-shadow: 0 0 0 1px #ddd; padding: .62in; max-width: 8.5in; min-height: 11in; } }
</style>
</head>
<body><main class="page">{{BODY}}</main></body>
</html>
